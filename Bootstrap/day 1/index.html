<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Day 1</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
  </head>
  <body>
    <div class="container-fluid">
      <h1 class="bg-danger px-4 py-4 text-center">Bootstrap</h1>
      Heading Bootstrap Classes
      <p class="h1">Heading 1</p>
      <p class="h2">Heading 2</p>
      <p class="h3">Heading 3</p>
      <p class="h4 bg-dark text-info">Heading 4</p>
      <p class="h5">Heading 5</p>
      <p class="h6">Heading 6</p>

      <!-- Display class -->

      <p class="display-1 bg-secondary">Display 2</p>
      <p class="display-2">Display 3</p>
      <p class="display-3">Display 4</p>
      <p class="display-4">Display 5</p>
      <p class="display-5">Display 6</p>
      <p class="display-6">Display 1</p>

      Text Color
      <p class="text-primary">Text color</p>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
