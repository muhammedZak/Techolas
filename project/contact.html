    <!-- -----------HEADER--------------- -->

      <nav class="navbar container">

    <main>
      <!-- -----------CONTACT FORM--------------- -->
      <section>
        <div class="container">
          <form action="#" class="">
            <h1>Get In Touch</h1>
            <p class="name-inputs">
              <input
                type="text"
                placeholder="First Name"
                name="First name"
                required
                autofocus
                id="" />
              <input
                type="text"
                placeholder="Last Name"
                name="last name"
                required
                id="" />
            </p>
            <p class="name-inputs">
              <input
                type="email"
                required
                placeholder="Email"
                name="email"
                id="" />
              <input
                type="number"
                placeholder="Phone"
                name="phone"
                id=""
                required />
            </p>
            <p class="name-inputs">
              <input type="text" placeholder="Address" />
            </p>
            <p class="name-inputs">
              <textarea
                name="messa"
                id=""
                placeholder="Type Your Message Here"></textarea>
            </p>
            <button>Submit</button>
          </form>
        </div>
      </section>
    </main>
