<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <form id="student-form">
            <div class="modal-header">
              <h5 class="modal-title">Add student details</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3 d-md-flex align-items-center gap-3">
                <label for="studentName" class="form-label labal-width"
                  >Name</label
                >
                <div class="w-100">
                  <input type="text" class="form-control" id="studentName" />
                  <p class="text-danger small m-0" id="nameError"></p>
                </div>
              </div>

              <div class="mb-3 d-md-flex align-items-center gap-3">
                <label for="studentEmail" class="form-label labal-width"
                  >Email</label
                >
                <div class="w-100">
                  <input type="email" class="form-control" id="studentEmail" />
                  <p class="text-danger small m-0" id="emailError"></p>
                </div>
              </div>

              <div class="mb-3 d-md-flex align-items-center gap-3">
                <label for="phone" class="form-label labal-width">Phone</label>
                <div class="w-100">
                  <input type="text" class="form-control" id="phone" />
                  <p class="text-danger small m-0" id="phoneError"></p>
                </div>
              </div>

              <div class="mb-3 d-md-flex align-items-center gap-3">
                <label for="studentAge" class="form-label labal-width"
                  >Age</label
                >
                <div class="w-100">
                  <input
                    type="number"
                    class="form-control"
                    id="studentAge"
                    min="18" />
                  <p class="text-danger small m-0" id="ageError"></p>
                </div>
              </div>

              <div class="mb-3 d-md-flex align-items-center gap-3">
                <label for="gender" class="form-label labal-width"
                  >Gender</label
                >
                <div class="w-100">
                  <select
                    id="gender"
                    class="form-select"
                    aria-label="Default select example">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                  <p class="text-danger small m-0" id="genderError"></p>
                </div>
              </div>

              <div class="mb-3 d-md-flex align-items-center gap-3">
                <label for="course" class="form-label labal-width"
                  >Course</label
                >
                <div class="w-100">
                  <select
                    id="course"
                    class="form-select"
                    aria-label="Default select example">
                    <option value="">Select course</option>
                    <option value="python fullstack">Python fullstack</option>
                    <option value="MERN stack">MERN stack</option>
                    <option value="DSA">DSA</option>
                  </select>
                  <p class="text-danger small m-0" id="courseError"></p>
                </div>
              </div>

              <label for="address" class="form-label labal-width"
                >Address</label
              >
              <textarea class="form-control" id="address" rows="3"></textarea>
              <p class="text-danger small m-0" id="addressError"></p>
            </div>
            <div class="modal-footer">
              <button
                id="btn-close"
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal">
                Close
              </button>
              <button id="form-btn" type="submit" class="btn btn-primary">
                Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <header class="font-monospace">
      <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand text-capitalize text-info" href="#"
            >Student Management</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse my-2"
            id="navbarSupportedContent">
            <div class="ms-auto d-flex align-items-center gap-2 flex-nowrap">
              <button
                type="button"
                class="btn btn-primary px-4"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal">
                Add
              </button>
              <form class="d-flex align-items-center mb-0" role="search">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Search" />
                <button class="btn btn-outline-success" type="submit">
                  Search
                </button>
              </form>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <main class="container mt-4">
        <div id="table-container"></div>
      </main>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
