<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <h1>Event Vender Registration Form</h1>
    <form action="">
      <!-- Name field -->
      <label for="">Your Name</label><br />
      <input type="text" name="" id="" required /><br /><br />

      <!-- Business Name -->
      <label for="">Business Name</label><br />
      <input type="text" name="" id="" required /><br /><br />

      <!-- Email -->
      <label for="">Email</label><br />
      <input
        type="email"
        name=""
        id=""
        placeholder="ex:example@gamil.com"
        required /><br /><br />

      <!-- Mobile Number -->
      <label for="">Phone Number</label><br />
      <input
        type="number"
        name=""
        id=""
        placeholder="54646116"
        required /><br /><br />

      <!-- Location Details -->
      <label for="">City where you are located</label><br />
      <input type="text" name="" id="" required /><br /><br />

      <!-- Product Listing -->
      <label for="">List the product's you will be selling</label><br />
      <textarea rows="5" cols="33">Type here</textarea><br /><br />

      <!-- Specific requests -->
      <label for="">Specific requests</label><br />
      <input type="text" name="" id="" required /><br /><br />

      <!-- terms and conditions -->
      <input type="checkbox" name="" id="" required /><label for=""
        >I agree to <a href="">terms & conditions</a>*</label
      ><br /><br />

      <!-- Joining date -->
      <label for="">Date joined</label><br />
      <input type="date" name="" id="" required /><br /><br />

      <!-- Submit -->
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
