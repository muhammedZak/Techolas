<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="1">
      <tr>
        <td colspan="5" align="center">New Employees Records</td>
      </tr>
      <tr>
        <th>Name</th>
        <th colspan="2">Jobs</th>
        <th colspan="2">Working Experience</th>
      </tr>
      <tr>
        <td>John</td>
        <td>Software engineer</td>
        <td>Data Analyst</td>
        <td rowspan="2">5 Years</td>
      </tr>
      <tr>
        <td>Ale</td>
        <td colspan="2">Software Web Developer</td>
      </tr>
      <tr>
        <td>Jack</td>
        <td>Junior Tech Writer</td>
        <td>Blogger</td>
        <td>6 Months</td>
      </tr>
    </table>
  </body>
</html>
