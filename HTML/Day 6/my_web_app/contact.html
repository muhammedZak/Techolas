<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact page</title>
  </head>
  <body>
    <div>
      <!-- Registration Form -->
      <h1>Registration Form</h1>
      <hr />

      <!-- form -->
      <form action="">
        <label for="">Gender:</label>
        <input type="radio" name="gender" id="" /><label for="">Male</label>
        <input type="radio" name="gender" id="" /><label for="">Female</label>
      </form>
      <br /><br />

      <!-- forms -->
      <form action="#">
        <label for="">UserName:</label>
        <input
          type="text"
          name=""
          id=""
          required
          minlength="5"
          maxlength="8"
          placeholder="enter username" /><br /><br />
        <label for="">Email:</label>
        <input
          type="email"
          name=""
          id=""
          required
          placeholder="enter your email" /><br /><br />
        <label for="">Password:</label>
        <input
          type="password"
          name=""
          id=""
          required
          placeholder="enter your password" />
        <br /><br />
        <input type="submit" name="" id="" value="Register" />
      </form>
      <br /><br />

      <video controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video
      ><br /><br />
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/nb_fFj_0rq8?si=FkRy6FoSvR9uDix9"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
      <br /><br />
      <audio
        controls
        autoplay
        src="assets/WhatsApp Ptt 2026-01-12 at 2.57.07 PM.ogg"></audio>
    </div>
  </body>
</html>
